name: pages
on:
  push:
    branches: [main]
  workflow_dispatch: {}
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      # The live track record is published from the ai-stock-agent-scorecard-site repo.
      # This site sends visitors there and keeps the synthetic demo at /demo/.
      - run: |
          python examples/demo.py
          mkdir -p pages && mv demo-site pages/demo
          LIVE=https://neogaurav.github.io/ai-stock-agent-scorecard-site/
          printf '<!DOCTYPE html><meta charset="utf-8"><title>AI Stock Agent Scorecard</title><meta http-equiv="refresh" content="0; url=%s"><link rel="canonical" href="%s"><p>Moved to <a href="%s">the live dashboard</a>. The synthetic demo is at <a href="demo/">demo/</a>.</p>' "$LIVE" "$LIVE" "$LIVE" > pages/index.html
          touch pages/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with: { path: pages }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.deployment.outputs.page_url }}" }
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
