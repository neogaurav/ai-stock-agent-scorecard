# Lives in your PRIVATE ledger-data repo. Grades, reveals and publishes nightly.
# 01:30 UTC Tue-Sat = 8:30 PM New York (EST) after each trading day; adjust for DST if you care.
name: nightly
on:
  schedule: [{ cron: "30 1 * * 2-6" }]
  workflow_dispatch: {}
permissions: { contents: write }
jobs:
  nightly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install "thesis-ledger[yfinance]"
      - run: thesis-ledger --root . nightly --out site --git
      - run: |
          git config user.name "thesis-ledger bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A public private config.json
          git commit -m "nightly $(date -u +%F)" || echo "nothing to commit"
          git push
      # Publish ONLY the built site to a separate PUBLIC repo served by GitHub Pages (free).
      # Create a deploy key with write access on the public repo; store the private half
      # here as the secret SITE_DEPLOY_KEY.
      - uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.SITE_DEPLOY_KEY }}
          external_repository: YOUR_GITHUB/thesis-ledger-site
          publish_branch: gh-pages
          publish_dir: ./site
